<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title"><title id="title">Action Hub: more capability, less context</title><rect width="1200" height="630" fill="#0d1117"/><path d="M70 90H1130M70 540H1130" stroke="#30363d"/><g font-family="sans-serif"><text x="70" y="65" font-size="24" fill="#3fb950">ACTION HUB / OPEN SOURCE MCP CAPABILITY LAYER</text><text x="70" y="235" font-size="82" font-weight="600" fill="#e6edf3">More capability.</text><text x="70" y="330" font-size="82" font-weight="600" fill="#8b949e">Less context.</text><text x="70" y="420" font-size="28" fill="#e6edf3">One fixed tool. A searchable capability catalog.</text><text x="70" y="590" font-size="22" fill="#8b949e">github.com/1solomonwakhungu/action-hub</text></g><g fill="#161b22" stroke="#30363d"><rect x="860" y="170" width="260" height="70" rx="8"/><rect x="860" y="280" width="260" height="70" rx="8"/><rect x="860" y="390" width="260" height="70" rx="8"/></g><path d="M990 240V280M990 350V390" stroke="#58a6ff" stroke-width="2"/><g font-family="monospace" font-size="26" fill="#58a6ff" text-anchor="middle"><text x="990" y="214">search</text><text x="990" y="324">load</text><text x="990" y="434">execute</text></g></svg>
